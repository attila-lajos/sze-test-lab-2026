<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Alkalmazás</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .todo-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
            text-align: center;
        }
        .input-group {
            display: flex;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px 15px;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #007bff;
            transition: all 0.2s;
        }
        li.done {
            border-left-color: #28a745;
            background: #f1f1f1;
        }
        li.done .task-text {
            text-decoration: line-through;
            color: #777;
        }
        .status-badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .status-badge.pending { background: #ffeeba; color: #856404; }
        .status-badge.completed { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="todo-container">
    <h1>Teendők Listája</h1>
    
    <!-- Új feladat hozzáadása -->
    <form id="todo-form" class="input-group">
        <input type="text" id="todo-input" placeholder="Új feladat hozzáadása..." required data-testid="todo-input">
        <button type="submit" data-testid="todo-submit-btn" id="add-todo-btn">Hozzáadás</button>
    </form>

    <!-- Feladatok listája -->
    <ul id="todo-list" data-testid="todo-list">
        <!-- A JavaScript ide fogja beszúrni az elemeket -->
    </ul>
</div>

<script>
    const API_URL = 'http://localhost:5000';
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');

    // 1. Feladatok lekérése a Flask backendből
    async function fetchTodos() {
        try {
            const response = await fetch(API_URL);
            const todos = await response.json();
            renderTodos(todos);
        } catch (error) {
            console.error('Hiba a feladatok lekérésekor:', error);
        }
    }

    // 2. Feladatok kirajzolása a felületre
    function renderTodos(todos) {
        todoList.innerHTML = '';
        todos.forEach(todo => {
            const li = document.createElement('li');
            li.setAttribute('data-testid', `todo-item-${todo.id}`);
            if (todo.done) li.classList.add('done');

            li.innerHTML = `
                <span class="task-text">${todo.task}</span>
                <span class="status-badge ${todo.done ? 'completed' : 'pending'}">
                    ${todo.done ? 'Kész' : 'Folyamatban'}
                </span>
            `;
            todoList.appendChild(li);
        });
    }

    // 3. Új feladat küldése (POST)
    todoForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const taskText = todoInput.value.trim();
        if (!taskText) return;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: taskText })
            });

            if (response.ok) {
                todoInput.value = '';
                fetchTodos(); // Lista frissítése
            }
        } catch (error) {
            console.error('Hiba a hozzáadás során:', error);
        }
    });

    // Oldal betöltésekor indítás
    fetchTodos();
</script>

</body>
</html>
